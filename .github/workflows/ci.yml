name: ci

# fmt once, then clippy (`--all-targets --all-features -- -D warnings`), check
# and nextest on each target of pyrlyn/ci's shared matrix. The matrix is not
# copied here: callers inherit it, and a pin move is how a matrix change
# arrives. That matrix is Linux x86_64, Linux aarch64, macOS aarch64
# (`xcode-27`) and Windows x86_64. Intel macOS is not a target.
#
# `cross` is a second call of the same workflow. ci-rust.yml accepts a matrix
# whose entries set `"test": false` (build instead of test). iOS, the iOS
# simulator, Android and wasm32 are passed that way. They are not added to the
# shared matrix, and macOS stays aarch64 only.
#
# Rust comes from mise.toml (1.99.0). ci-rust fails the job when rustc is
# anything else.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # changes.yml classifies the diff. `docs_only` turns the Rust work into
  # no-ops that still report under `rust / <target>`, so a required check does
  # not wait. A path no rule claims is not documentation, and a failed
  # classification does not skip the suite: same fail-open rule as path-gates
  # (`unmatched = all` runs every gate).
  changes:
    uses: pyrlyn/ci/.github/workflows/changes.yml@27290ae30105592f683c236fc76dcc2ee4348bdf # main
    permissions:
      contents: read
    with:
      # Snapshots and fixtures under crates/ are the Rust suite even when
      # they are not `.rs` or a Cargo manifest.
      rust-paths: |
        ^crates/

  rust:
    needs: changes
    # A failed `changes` job must run the suite, not skip it.
    if: ${{ !cancelled() }}
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@27290ae30105592f683c236fc76dcc2ee4348bdf # main
    # cancel-run-on-failure (on by default) needs `actions: write` on the caller.
    permissions:
      contents: read
      actions: write
    with:
      clippy-args: --locked
      tools: nextest
      # The local workspace check. `-D warnings` is inside ci-rust.yml, after `--`.
      test-command: cargo nextest run --workspace --locked
      # Docs-only: no work, same check names. Any other diff runs the suite.
      skip: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}

  # Build-only extras. `"test": false` is the ci-rust input for a build instead
  # of a test run; these triples also differ from the runner host, so the
  # reusable workflow takes its cross build path. Libraries only: mailune-cli
  # is a host binary, and `--lib` does not link test harnesses (no Android NDK
  # and no wasm linker on the runner). full-package-args repeats the exclude so
  # a Cargo.toml change does not pull the binary back in.
  cross:
    needs: changes
    if: ${{ !cancelled() }}
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@27290ae30105592f683c236fc76dcc2ee4348bdf # main
    permissions:
      contents: read
      actions: write
    with:
      matrix: |
        [
          {"os": "xcode-27", "target": "aarch64-apple-ios", "test": false},
          {"os": "xcode-27", "target": "aarch64-apple-ios-sim", "test": false},
          {"os": "ubuntu-latest", "target": "aarch64-linux-android", "test": false},
          {"os": "ubuntu-latest", "target": "wasm32-unknown-unknown", "test": false}
        ]
      package-args: --workspace --exclude mailune-cli
      full-package-args: --workspace --exclude mailune-cli
      clippy-args: --locked
      # mailune-store builds bundled SQLite, so cc-rs needs a C compiler for
      # Android. The runner image ships the NDK; its clang wrappers carry an
      # API level, so cc-rs does not find them by the bare triple.
      setup-command: |
        if [ "$TARGET" = aarch64-linux-android ]; then
          bin="${ANDROID_NDK_LATEST_HOME:?no Android NDK on the runner}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
        fi
      build-command: cargo build --workspace --exclude mailune-cli --lib $FEATURE_ARGS --locked --target "$TARGET"
      skip: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
