name: cla

# Contributor License Agreement check: a thin caller of pyrlyn/ci's cla.yml.
# Members of the pyrlyn organization and allowlisted bots pass; anyone else
# signs once by pull request comment. The decision is the commit status
# `pyrlyn/cla`. Off until CLA_ENABLED is 'true' (the reusable job skips, and a
# skipped check passes). pull_request_target runs this file from the default
# branch. The reusable workflow does not check out pull request code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  cla:
    uses: pyrlyn/ci/.github/workflows/cla.yml@27290ae30105592f683c236fc76dcc2ee4348bdf # main
    permissions:
      contents: read
      pull-requests: write # the sticky comment, lock after merge
      statuses: write # the pyrlyn/cla commit status
    secrets:
      CLA_APP_ID: ${{ secrets.CLA_APP_ID }}
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
      CLA_SIGNATURES_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
