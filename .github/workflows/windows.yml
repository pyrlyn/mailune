name: windows

# Runs the Windows class-library tests. This file does not change ci.yml
# or any required check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet test Mailune.slnx
