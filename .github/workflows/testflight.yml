name: testflight

# Uploads the iOS app to TestFlight through the R13 reusable workflow in
# pyrlyn/ci, pinned by commit SHA. desktop/macos/scripts/ipa.sh is its build
# command and makes the IPA, signed with the App Store Connect key that the
# reusable workflow writes before the build; it then uploads. No Developer ID
# certificate is involved. Dispatch only, so it is never a pull-request check
# and the required checks are unchanged. It cannot upload until the App Store
# Connect secrets and the APPLE_TEAM_ID variable are set.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    permissions:
      contents: read
      actions: write # cancel-run on failure
    uses: pyrlyn/ci/.github/workflows/testflight.yml@7314d202526b640cb78f88f41450354d7d2e79fa # main
    with:
      ipa: desktop/macos/build/ipa/MailuneIOS.ipa
      # The team id is not a secret; ipa.sh refuses anything but ten letters
      # and digits.
      build-command: MAILUNE_TEAM_ID='${{ vars.APPLE_TEAM_ID }}' desktop/macos/scripts/ipa.sh
      # The only image with Xcode 27, which the iOS 26 SDK needs (see swift.yml).
      runs-on: xcode-27
      xcode-version: "27"
      # ipa.sh runs XcodeGen through mise and the Apple catalogs need
      # translate-toolkit. Rust and Node are not needed here.
      setup-mise: true
      mise-install-args: pipx:translate-toolkit
      developer-id: false
    secrets:
      APPSTORE_CONNECT_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
