name: Nightly fuzz

# Short parser fuzzing on nightly. pyrlyn/ci@27290ae30105592f683c236fc76dcc2ee4348bdf
# has no fuzz workflow, so this file is our own. It is not a pull-request check
# and does not change the required jobs in ci.yml. A crash lands in
# fuzz/artifacts/ and fails the job.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [mime-parse, autoconfig-xml, search-query]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-fuzz needs nightly, the one toolchain not pinned in mise.toml.
      - name: nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
