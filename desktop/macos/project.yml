# XcodeGen spec for the macOS app. Mailune.xcodeproj is generated from this
# file and is not committed. Apple Silicon only: no target builds an Intel slice,
# and the iOS simulator build is arm64 too.
# MailuneCore (the Rust XCFramework) is not wired yet: it waits on B3, so the
# model package serves fixture data.
name: Mailune
options:
  bundleIdPrefix: app.mailune
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  # MailuneUI's catalogs are generated from i18n/, never written by hand.
  preGenCommand: scripts/catalogs.sh
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  MailuneModel:
    path: MailuneModel
  MailuneUI:
    path: MailuneUI
  MailunePlatform:
    path: MailunePlatform
targets:
  Mailune:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: MailuneModel
      - package: MailuneUI
      - package: MailunePlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.macos
        PRODUCT_NAME: Mailune
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mailune
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    # XcodeGen writes this plist on every generate; it is not committed.
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.mailune.mailto
            CFBundleURLSchemes: [mailto]
  MailuneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MailuneTests
    dependencies:
      - package: MailunePlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.macos.tests
        GENERATE_INFOPLIST_FILE: YES
  MailuneUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MailuneUITests
    dependencies:
      - target: Mailune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mailune
  MailuneIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: MailuneModel
      - package: MailuneUI
      - package: MailunePlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.ios
        PRODUCT_NAME: MailuneIOS
        # The icon set is macOS-only so far; iOS builds without an app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mailune
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
schemes:
  Mailune:
    build:
      targets:
        Mailune: all
        MailuneTests: [test]
    test:
      targets:
        - MailuneTests
  # Separate because a UI test needs a logged-in GUI session, which SSH and
  # headless runs do not have; scripts/uitest.sh runs it.
  MailuneUITests:
    build:
      targets:
        Mailune: all
        MailuneUITests: [test]
    test:
      targets:
        - MailuneUITests
  MailuneIOS:
    build:
      targets:
        MailuneIOS: all
