# XcodeGen spec for the macOS app. Mailune.xcodeproj is generated from this
# file and is not committed. Apple Silicon only.
name: Mailune
options:
  bundleIdPrefix: app.mailune
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  MailuneModel:
    path: MailuneModel
  MailuneUI:
    path: MailuneUI
  MailunePlatform:
    path: MailunePlatform
targets:
  Mailune:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MailuneModel
      - package: MailuneUI
      - package: MailunePlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.macos
        PRODUCT_NAME: Mailune
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mailune
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  MailuneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MailuneTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
  MailuneUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MailuneUITests
    dependencies:
      - target: Mailune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mailune
        ARCHS: arm64
  MailuneIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iOS
    dependencies:
      - package: MailuneModel
      - package: MailuneUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailune.ios
        PRODUCT_NAME: MailuneIOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
schemes:
  Mailune:
    build:
      targets:
        Mailune: all
        MailuneTests: [test]
        MailuneUITests: [test]
    test:
      targets:
        - MailuneTests
        - MailuneUITests
  MailuneIOS:
    build:
      targets:
        MailuneIOS: all
