[workspace]
resolver = "3"
members = ["crates/*"]
# fuzz/ is its own cargo-fuzz workspace. Excluded so `cargo test --workspace` does not build it.
exclude = ["fuzz"]
# Bare `cargo run` / `cargo build` resolve against the CLI. The manifest is
# virtual (no root package). Test and lint commands pass `--workspace`.
default-members = ["crates/mailune-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# GPLv3 or the royalty-free licence in LICENSE-ROYALTY-FREE.md, at the user's choice.
license = "GPL-3.0-or-later OR LicenseRef-Mailune-Royalty-Free"

# Versions live here once. Members write `dep = { workspace = true }`.
[workspace.dependencies]
# One error enum per library crate.
thiserror = "2"
# mailune-protocol: the contract is serde so every surface sees one shape.
serde = { version = "1", features = ["derive"] }
# mailune-protocol: JSON Schema committed via insta. 1.2.2 checked on crates.io 2026-10-08.
schemars = "1.2.2"
# mailune-protocol tests: turn a schema into a snapshot value.
serde_json = "1"
# mailune-protocol tests: the committed JSON Schema. 1.49.0 checked on crates.io 2026-10-08.
insta = { version = "1.49.0", features = ["json"] }
# mailune-cli only. Library crates return their own error type.
anyhow = "1"
# mailune-cli: account add/list. 4.6 matches cox; derive only.
clap = { version = "4.6", features = ["derive"] }
# mailune-cli tests: the dependency-direction check reads `cargo metadata`.
cargo_metadata = "0.23.1"
# mailune-cli tests: parse Rust sources for the forward-only FFI scaffold.
# 3.0.6 checked on crates.io 2026-10-08. Parsing only; default features stay off.
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing"] }
# mailune-mime: grammar for RFC 5322 / MIME. 0.11.9 checked on crates.io 2026-10-08.
# `full_encoding` is the path that decodes the long tail (Shift_JIS and the rest) through encoding_rs.
mail-parser = { version = "0.11.9", default-features = false, features = ["full_encoding"] }
# mailune-mime: canonical charset name from the Encoding Standard. 0.8.42 checked on crates.io 2026-10-08.
encoding_rs = "0.8.42"
# mailune-mime: build a message the parser can read back. 1.0.0 checked on crates.io 2026-10-08.
# Default features pull gethostname for a generated Message-ID. Callers set the id, so that stays off.
mail-builder = { version = "1.0.0", default-features = false }
# mailune-auth: Mozilla autoconfig XML. 0.42.0 from `cargo search` on 2026-10-08.
quick-xml = "0.42.0"
# mailune-auth: PKCE S256. Same major as ketch and cox.
sha2 = "0.11"
# mailune-auth: unpadded base64url for the PKCE verifier and challenge.
base64 = "0.23"
# mailune-mime: HTML sanitizer. 4.2.1 checked on crates.io 2026-10-08.
ammonia = "4.2.1"
# mailune-mime: plain text from the sanitized HTML fragment. 0.17.1 checked on crates.io 2026-10-08.
html2text = "0.17.1"
# mailune-mime: DKIM rsa-sha256. 0.9.10 is the stable line (0.10 is still a release candidate), checked on crates.io 2026-10-08.
# The sha2 feature re-exports the digest the verifier hashes with.
rsa = { version = "0.9.10", features = ["sha2"] }
# DKIM test keys and OpenPGP key generation. 0.8 matches rsa 0.9 and pgp 0.20. 0.8.8 checked on crates.io 2026-10-08.
rand = "0.8.8"
# mailune-imap: IMAP codec. 1.0.0 is the stable line chosen in docs/imap-stack.md. Checked on crates.io 2026-10-08.
imap-codec = "1.0.0"
# mailune-mime: RFC 5545 parse. 0.17.14 checked on crates.io 2026-10-08.
icalendar = "0.17.14"
# mailune-crypto: OpenPGP sign and encrypt. 0.20.0 is the pgp crate already used in this workspace. Default features stay off so bzip2 is not linked.
pgp = { version = "0.20.0", default-features = false }
# fuzz/: libFuzzer. That package is a separate workspace, so fuzz/Cargo.toml repeats this version.
libfuzzer-sys = "0.4.13"
# mailune-mcp: local MCP server. 3.5.1 checked on crates.io 2026-10-08.
# Default features stay off. `server` is the in-process tool surface; tests add `client`.
rmcp = { version = "3.5.1", default-features = false, features = ["server"] }
# mailune-mcp tests: in-memory duplex instead of a socket. 1.53.2 matches aulo, checked 2026-10-08.
tokio = { version = "1.53.2", default-features = false }

# Lints every member inherits through `[lints] workspace = true`. CI runs
# clippy with `-D warnings`, so `warn` here fails the build just like `deny`.
# `unwrap_used`, `expect_used` and `panic` are denied outside tests; clippy.toml
# turns them back on under `#[cfg(test)]` and integration tests.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Dev builds: debug info for our own crates only. Line tables still give
# file:line in backtraces; dependency DWARF is the bulk of a debug target/.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# The profile that dist builds with. Ordinary `--release` stays fast.
# `panic = "abort"` is absent: a panicking extension must become an error
# the process can skip (fail open), which abort removes.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
