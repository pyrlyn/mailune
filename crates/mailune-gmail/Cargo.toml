[package]
name = "mailune-gmail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Gmail API adapter over an injected HTTP transport"

# google-gmail1 is not linked (plan.md P21); requests are built here and sent
# through the injected `Http` transport, so tests never dial out.
[dependencies]
base64 = { workspace = true }
mailune-protocol = { path = "../mailune-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mailune-store = { path = "../mailune-store" }
mailune-testkit = { path = "../mailune-testkit" }
tempfile = { workspace = true }

[lints]
workspace = true
