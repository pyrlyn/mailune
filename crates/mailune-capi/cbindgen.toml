# What the header drift test in src/lib.rs generates include/mailune.h with.
language = "C"
include_guard = "MAILUNE_H"
header = """
/*
 * Generated by cbindgen from crates/mailune-capi/src/abi.rs:
 * `MAILUNE_BLESS=1 cargo nextest run -p mailune-capi`. Do not edit.
 */"""
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
