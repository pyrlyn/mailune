# The header drift test in src/lib.rs generates include/mailune.h with this.
language = "C"
include_guard = "MAILUNE_H"
header = """
/*
 * Generated by cbindgen from crates/mailune-capi/src/lib.rs.
 * Do not edit.
 */"""
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false
