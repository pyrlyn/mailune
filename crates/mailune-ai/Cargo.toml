[package]
name = "mailune-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Privacy classes, feature routing, and typed model results"

[dependencies]
mailune-protocol = { path = "../mailune-protocol" }
thiserror = { workspace = true }
# Typed tool calls arrive as JSON from the model and from MCP clients.
serde = { workspace = true }
serde_json = { workspace = true }
# Model blobs are trusted only after their SHA-256 matches the catalog.
sha2 = { workspace = true }
# A message's language, detected on the device without a model call.
whatlang = { workspace = true }

[dev-dependencies]
mailune-testkit = { path = "../mailune-testkit" }
insta = { workspace = true }

[lints]
workspace = true
