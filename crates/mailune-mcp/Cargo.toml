[package]
name = "mailune-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local MCP server: forwards typed tool calls to the agent policy"

[dependencies]
mailune-ai = { path = "../mailune-ai" }
mailune-protocol = { path = "../mailune-protocol" }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

[lints]
workspace = true
