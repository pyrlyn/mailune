[package]
name = "mailune-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local mail store: SQLite through Diesel"

[dependencies]
mailune-core = { path = "../mailune-core" }
mailune-protocol = { path = "../mailune-protocol" }
thiserror = { workspace = true }

# The browser build has no C toolchain for SQLite; the WASM store (OPFS) is a
# later task, so the crate is empty there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
# Recipient lists are one JSON column; a row per address buys nothing yet.
serde_json = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

# Apple targets link SQLCipher against CommonCrypto, so no OpenSSL is needed.
# Elsewhere SQLCipher would need an OpenSSL build on every CI runner (Windows
# has none), so those targets use plain SQLite and refuse a key at open.
[target.'cfg(target_vendor = "apple")'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(any(target_vendor = "apple", target_arch = "wasm32")))'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled"] }

[dev-dependencies]
# The chunker feeds the embedding test; the store itself never parses mail.
mailune-mime = { path = "../mailune-mime" }
tempfile = { workspace = true }
# Random blob keys, so no test carries a hard-coded key.
rand = { workspace = true }

# The store is empty on wasm32, so its benches are too.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
divan = { workspace = true }

# T6 budgets at 100k messages. `nextest` runs the small-mailbox version in tests/budgets.rs.
[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
